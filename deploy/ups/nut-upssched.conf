# Network UPS Tools example - /etc/nut/upssched.conf
# In /etc/nut/upsmon.conf set:
#   NOTIFYCMD /usr/sbin/upssched
#   NOTIFYFLAG ONBATT SYSLOG+EXEC
#   NOTIFYFLAG ONLINE SYSLOG+EXEC
#   NOTIFYFLAG LOWBATT SYSLOG+EXEC
CMDSCRIPT /usr/local/bin/7edcore-upssched-cmd
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock

AT ONBATT * START-TIMER save 60
AT ONBATT * START-TIMER stopall 300
AT ONLINE * CANCEL-TIMER save
AT ONLINE * CANCEL-TIMER stopall
AT ONLINE * START-TIMER resume 60
AT ONBATT * CANCEL-TIMER resume
AT LOWBATT * EXECUTE stopall
