name: build

# Every push to main: tests, then image :edge.
# Releasing: add "## X.Y.Z - <date>" at the top of CHANGELOG.md and push to main.
# If tag vX.Y.Z does not exist yet, this workflow publishes :X.Y.Z, :X.Y and :latest,
# creates the tag and the GitHub release (notes from CHANGELOG.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp psutil
      - name: API tests (fake steamcmd + fake game server)
        run: |
          mkdir -p /tmp/data
          tests/run_server.sh /tmp/data 18200 > /tmp/panel.log 2>&1 &
          sleep 3
          python3 tests/api_test.py http://127.0.0.1:18200 testpass123 || (cat /tmp/panel.log; exit 1)
          DATA_DIR=/tmp/data PANEL_PORT=18200 python3 app/ctl.py status
      - name: Shell scripts
        run: for f in install.sh deploy/7edcore deploy/7edcore-update deploy/power/7edcore-powerwatch; do bash -n "$f"; done

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(grep -m1 -oP '^## \K[0-9]+\.[0-9]+\.[0-9]+(?= - [0-9]{4}-)' CHANGELOG.md || true)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ -n "$V" ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ] \
             && ! git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "releasing $V"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "no new release (changelog: ${V:-none})"
          fi

  image:
    needs: [test, version]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: echo "IMAGE=ghcr.io/${OWNER,,}/7edcore" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.release == 'true' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ needs.version.outputs.release == 'true' && needs.version.outputs.version || format('edge-{0}', github.sha) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [version, image]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag and GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.version.outputs.version }}
        run: |
          {
            echo '**Install** (Linux x86_64 with systemd):'
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sudo bash"
            echo '```'
            echo "Installed servers update to this version automatically. Docker image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/7edcore:${V}\`"
            echo
            awk -v v="$V" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md
          } > notes.md
          gh release create "v$V" --target "$GITHUB_SHA" --title "7edCore $V" --notes-file notes.md
