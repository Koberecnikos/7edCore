name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp psutil
      - name: API tests (fake steamcmd + fake game server)
        run: |
          mkdir -p /tmp/data
          tests/run_server.sh /tmp/data 18200 > /tmp/panel.log 2>&1 &
          sleep 3
          python3 tests/api_test.py http://127.0.0.1:18200 testpass123 || (cat /tmp/panel.log; exit 1)
          DATA_DIR=/tmp/data PANEL_PORT=18200 python3 app/ctl.py status
      - name: Shell scripts
        run: for f in install.sh deploy/7edcore deploy/7edcore-update deploy/power/7edcore-powerwatch; do bash -n "$f"; done

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: echo "IMAGE=ghcr.io/${OWNER,,}/7edcore" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('edge-{0}', github.sha) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          {
            echo '**Install** (Linux x86_64 with systemd):'
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sudo bash"
            echo '```'
            echo "Installed servers update to this version automatically. Docker image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/7edcore:${V}\`"
            echo
            awk -v v="$V" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md
          } > notes.md
          gh release create "$TAG" --verify-tag --title "7edCore $V" --notes-file notes.md
